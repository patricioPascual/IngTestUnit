name: Corrección Automática de JUnit 5

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Configurar Java 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'

    - name: Instalar Ant
      run: sudo apt-get update && sudo apt-get install -y ant

    - name: Ejecutar tests
      run: ant test