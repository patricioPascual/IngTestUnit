name: Corrección Automática de JUnit 5

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Instalar Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Descargar JUnit y Hamcrest
        run: |
          mkdir -p lib
          wget https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -O lib/junit-4.13.2.jar
          wget https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -O lib/hamcrest-core-1.3.jar

      - name: Ejecutar tests
        run: |
          ant \
          -Dlibs.junit_4.classpath=lib/junit-4.13.2.jar \
          -Dlibs.hamcrest.classpath=lib/hamcrest-core-1.3.jar \
          test